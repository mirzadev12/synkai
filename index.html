<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101413" />
    <meta
      name="description"
      content="Synk AI — a multiplayer canvas with AI models as draggable objects."
    />
    <title>Synk AI</title>
    <script>
      try {
        if (localStorage.getItem("synk-ai-theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      IBM Plex Sans = all UI text/labels. IBM Plex Mono = AI Block prompt/output
      and data-ish text. Material Symbols is still loaded because every icon in
      the app is currently a Material ligature; it comes out once the
      lucide-react swap lands.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
